name: One-time wire person profile icon

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'fix: wire person profile icon')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch profile action wiring
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/eleyas/expensetracker/ui/screens/LoansScreen.kt')
          s = p.read_text()

          s = s.replace(
              'import androidx.compose.foundation.layout.*',
              'import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.clickable'
          )

          s = s.replace(
              '    var locallyDeletedLoanIds by remember { mutableStateOf<Set<Long>>(emptySet()) }',
              '    var locallyDeletedLoanIds by remember { mutableStateOf<Set<Long>>(emptySet()) }\n    var profileDialogTarget by remember { mutableStateOf<PersonProfile?>(null) }\n    var localPeople by remember(people) { mutableStateOf(people) }'
          )

          marker = '    if (shareOptionsLoan != null) {'
          dialog = '''    if (profileDialogTarget != null) {
          val target = profileDialogTarget!!
          var phone by remember(target.id) { mutableStateOf(target.phone) }
          var note by remember(target.id) { mutableStateOf(target.note) }
          AlertDialog(
              onDismissRequest = { profileDialogTarget = null },
              title = { Text(if (target.phone.isBlank() && target.note.isBlank()) "ব্যক্তির প্রোফাইল যোগ করুন" else "ব্যক্তির প্রোফাইল এডিট") },
              text = {
                  Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      Text(target.name.ifBlank { "ব্যক্তি" }, fontSize = 17.sp, fontWeight = FontWeight.Bold)
                      Text("AH User ID: ${userIdForPerson(AccountStorage.getPrefs(context, FirebaseAuth.getInstance().currentUser?.uid ?: "guest"), target)}", fontSize = 12.sp, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                      OutlinedTextField(value = phone, onValueChange = { phone = it }, modifier = Modifier.fillMaxWidth(), label = { Text("ফোন নম্বর") }, singleLine = true)
                      OutlinedTextField(value = note, onValueChange = { note = it }, modifier = Modifier.fillMaxWidth(), label = { Text("নোট") }, minLines = 2)
                  }
              },
              confirmButton = {
                  Button(onClick = {
                      val userId = FirebaseAuth.getInstance().currentUser?.uid ?: "guest"
                      val prefs = AccountStorage.getPrefs(context, userId)
                      val updated = target.copy(phone = phone.trim(), note = note.trim(), updatedAt = System.currentTimeMillis())
                      val merged = localPeople.filterNot { it.id == updated.id } + updated
                      savePersonProfiles(prefs, merged)
                      localPeople = merged
                      profileDialogTarget = null
                  }) { Text("সংরক্ষণ") }
              },
              dismissButton = { TextButton(onClick = { profileDialogTarget = null }) { Text("বাতিল") } }
          )
      }

'''
          if marker not in s:
              raise SystemExit('profile dialog insertion marker not found')
          s = s.replace(marker, dialog + marker, 1)

          s = s.replace(
              '                        loan = loan,\n                        loanPayments = activeLoanPayments,',
              '                        loan = loan,\n                        people = localPeople,\n                        loanPayments = activeLoanPayments,'
          )
          s = s.replace(
              '                        onPayment = {\n                            val paid = activeLoanPayments.filter { it.loanId == loan.id }.sumOf { it.amount }',
              '                        onPayment = {\n                            val paid = activeLoanPayments.filter { it.loanId == loan.id }.sumOf { it.amount }'
          )
          old = '''                        onEditLoanPayment = onEditLoanPayment,
                        onDeleteLoanPayment = onDeleteLoanPayment
                    )'''
          new = '''                        onEditLoanPayment = onEditLoanPayment,
                        onDeleteLoanPayment = onDeleteLoanPayment,
                        onProfileClick = {
                            val existing = localPeople.firstOrNull { it.id == loan.personId || it.name.trim().equals(loan.name.trim(), ignoreCase = true) }
                            profileDialogTarget = existing ?: PersonProfile(
                                id = loan.personId ?: java.util.UUID.randomUUID().toString(),
                                name = loan.name.trim()
                            )
                        }
                    )'''
          if old not in s:
              raise SystemExit('loan callback marker not found')
          s = s.replace(old, new, 1)

          s = s.replace(
              '                        lending = lending,\n                        lendingReturns = lendingReturns,',
              '                        lending = lending,\n                        people = localPeople,\n                        lendingReturns = lendingReturns,'
          )
          old = '''                        onDelete = { onDeleteLending(lending) },
                        onAddReturn = { onAddLendingReturn(lending) }
                    )'''
          new = '''                        onDelete = { onDeleteLending(lending) },
                        onAddReturn = { onAddLendingReturn(lending) },
                        onProfileClick = {
                            val existing = localPeople.firstOrNull { it.id == lending.personId || it.name.trim().equals(lending.person.trim(), ignoreCase = true) }
                            profileDialogTarget = existing ?: PersonProfile(
                                id = lending.personId ?: java.util.UUID.randomUUID().toString(),
                                name = lending.person.trim()
                            )
                        }
                    )'''
          if old not in s:
              raise SystemExit('lending callback marker not found')
          s = s.replace(old, new, 1)

          s = s.replace(
              '    onDeleteLoanPayment: (LoanPayment) -> Unit\n) {',
              '    onDeleteLoanPayment: (LoanPayment) -> Unit,\n    onProfileClick: () -> Unit = {}\n) {'
          )
          s = s.replace(
              '    onAddReturn: () -> Unit\n) {',
              '    onAddReturn: () -> Unit,\n    onProfileClick: () -> Unit = {}\n) {'
          )

          old = '''                    Text(loan.name.ifBlank { "ঋণ" }, fontSize = 18.sp, fontWeight = FontWeight.ExtraBold)
                    if (loan.note.isNotBlank()) Text(loan.note, fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)'''
          new = '''                    Row(verticalAlignment = Alignment.CenterVertically) {
                        Text(loan.name.ifBlank { "ঋণ" }, fontSize = 18.sp, fontWeight = FontWeight.ExtraBold, modifier = Modifier.weight(1f, fill = false))
                        if (loan.sourceType != "bank") {
                            IconButton(onClick = onProfileClick, modifier = Modifier.size(34.dp)) {
                                Icon(Icons.Default.Person, contentDescription = "ব্যক্তির প্রোফাইল", tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(20.dp))
                            }
                        }
                    }
                    if (loan.note.isNotBlank()) Text(loan.note, fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)'''
          if old not in s:
              raise SystemExit('loan name marker not found')
          s = s.replace(old, new, 1)

          old = '''                    Text(lending.person.ifBlank { "ব্যক্তি" }, fontSize = 19.sp, fontWeight = FontWeight.ExtraBold)
                    Text("ধার দেওয়া: ${displayLoanDate(lending.date)}", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)'''
          new = '''                    Row(verticalAlignment = Alignment.CenterVertically) {
                        Text(lending.person.ifBlank { "ব্যক্তি" }, fontSize = 19.sp, fontWeight = FontWeight.ExtraBold, modifier = Modifier.weight(1f, fill = false))
                        IconButton(onClick = onProfileClick, modifier = Modifier.size(34.dp)) {
                            Icon(Icons.Default.Person, contentDescription = "ব্যক্তির প্রোফাইল", tint = TealGreen, modifier = Modifier.size(20.dp))
                        }
                    }
                    Text("ধার দেওয়া: ${displayLoanDate(lending.date)}", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)'''
          if old not in s:
              raise SystemExit('lending name marker not found')
          s = s.replace(old, new, 1)

          # The helper lives in PersonProfileUtils and is already used by PersonUserIdBadge.
          if 'import com.eleyas.expensetracker.util.userIdForPerson' not in s:
              s = s.replace('import com.eleyas.expensetracker.util.formatMoney', 'import com.eleyas.expensetracker.util.formatMoney\nimport com.eleyas.expensetracker.util.userIdForPerson\nimport com.eleyas.expensetracker.util.savePersonProfiles')

          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/eleyas/expensetracker/ui/screens/LoansScreen.kt
          git commit -m "fix: wire person profile icon" || exit 0
          git push origin dev
