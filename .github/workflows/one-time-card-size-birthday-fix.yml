name: One-time card size birthday fix

on:
  push:
    branches:
      - feature/my-journey

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply UI-only fix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/src/main/java/com/eleyas/expensetracker/ui/screens/PremiumHomeHeader.kt',
              'modifier = Modifier.fillMaxWidth(),\n        shape = RoundedCornerShape(30.dp)',
              'modifier = Modifier.fillMaxWidth().height(280.dp),\n        shape = RoundedCornerShape(30.dp)'
          )
          replace_once(
              'app/src/main/java/com/eleyas/expensetracker/ui/screens/PremiumHomeHeader.kt',
              'modifier = Modifier\n                .fillMaxWidth()\n                .background(',
              'modifier = Modifier\n                .fillMaxSize()\n                .background('
          )
          replace_once(
              'app/src/main/java/com/eleyas/expensetracker/ui/screens/PremiumHomeHeader.kt',
              'Spacer(\n                        modifier = Modifier.height(16.dp)\n                    )',
              'Spacer(\n                        modifier = Modifier.height(8.dp)\n                    )'
          )
          replace_once(
              'app/src/main/java/com/eleyas/expensetracker/ui/screens/PremiumHomeHeader.kt',
              'shape = RoundedCornerShape(20.dp),\n                        color = Color(0xFF292B30)',
              'shape = RoundedCornerShape(14.dp),\n                        color = Color(0xFF292B30)'
          )
          replace_once(
              'app/src/main/java/com/eleyas/expensetracker/ui/screens/PremiumHomeHeader.kt',
              'horizontal = 18.dp,\n                                    vertical = 12.dp',
              'horizontal = 12.dp,\n                                    vertical = 7.dp'
          )
          replace_once(
              'app/src/main/java/com/eleyas/expensetracker/ui/screens/PremiumHomeHeader.kt',
              'fontSize = 16.sp,\n                                    fontWeight = FontWeight.Bold',
              'fontSize = 13.sp,\n                                    fontWeight = FontWeight.Bold'
          )
          replace_once(
              'app/src/main/java/com/eleyas/expensetracker/ui/screens/PremiumHomeHeader.kt',
              'fontSize = 25.sp,\n                                        fontWeight =\n                                            FontWeight.ExtraBold',
              'fontSize = 19.sp,\n                                        fontWeight =\n                                            FontWeight.ExtraBold'
          )
          replace_once(
              'app/src/main/java/com/eleyas/expensetracker/ui/screens/PremiumHomeHeader.kt',
              'modifier = Modifier.size(52.dp)',
              'modifier = Modifier.size(38.dp)'
          )
          replace_once(
              'app/src/main/java/com/eleyas/expensetracker/ui/screens/PremiumHomeHeader.kt',
              'modifier =\n                                        Modifier.size(34.dp)',
              'modifier =\n                                        Modifier.size(24.dp)'
          )

          replace_once(
              'app/src/main/java/com/eleyas/expensetracker/ui/screens/NetWorthDashboard.kt',
              'modifier = Modifier.fillMaxWidth(),\n        shape = RoundedCornerShape(28.dp)',
              'modifier = Modifier.fillMaxWidth().height(280.dp),\n        shape = RoundedCornerShape(28.dp)'
          )
          replace_once(
              'app/src/main/java/com/eleyas/expensetracker/ui/screens/NetWorthDashboard.kt',
              'modifier = Modifier\n                .fillMaxWidth()\n                .background(',
              'modifier = Modifier\n                .fillMaxSize()\n                .background('
          )

          replace_once(
              'app/src/main/java/com/eleyas/expensetracker/ui/screens/HomeScreen.kt',
              'modifier = Modifier.fillMaxWidth(),\n        shape = RoundedCornerShape(28.dp),\n        colors = CardDefaults.cardColors(containerColor = Color.Transparent),\n        elevation = CardDefaults.cardElevation(defaultElevation = 10.dp)\n    ) {\n        Box(\n            modifier = Modifier\n                .fillMaxWidth()\n                .background(',
              'modifier = Modifier.fillMaxWidth().height(280.dp),\n        shape = RoundedCornerShape(28.dp),\n        colors = CardDefaults.cardColors(containerColor = Color.Transparent),\n        elevation = CardDefaults.cardElevation(defaultElevation = 10.dp)\n    ) {\n        Box(\n            modifier = Modifier\n                .fillMaxSize()\n                .background('
          )

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/eleyas/expensetracker/ui/screens/PremiumHomeHeader.kt app/src/main/java/com/eleyas/expensetracker/ui/screens/NetWorthDashboard.kt app/src/main/java/com/eleyas/expensetracker/ui/screens/HomeScreen.kt
          git commit -m "Make home cards equal and compact birthday"
          git rm .github/workflows/one-time-card-size-birthday-fix.yml
          git commit -m "Remove one-time card fix workflow"
          git push
