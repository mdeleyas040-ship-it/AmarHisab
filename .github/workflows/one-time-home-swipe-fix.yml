name: One-time Home Swipe Fix
on:
  push:
    branches: ["feature/my-journey"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch HomeScreen swipe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/eleyas/expensetracker/ui/screens/HomeScreen.kt')
          s = p.read_text()
          start = s.index('@Composable\nprivate fun SmoothSwipeableBalanceCards(')
          end = s.index('@Composable\nprivate fun PremiumHomeAccountCard', start)
          new_fn = '''@Composable
private fun SmoothSwipeableBalanceCards(
    page: Int,
    onPageChange: (Int) -> Unit,
    first: @Composable () -> Unit,
    second: @Composable () -> Unit,
    third: @Composable () -> Unit
) {
    val pages = listOf(first, second, third)
    var dragOffset by remember { mutableFloatStateOf(0f) }
    var isAnimating by remember { mutableStateOf(false) }
    val scope = rememberCoroutineScope()

    BoxWithConstraints(
        modifier = Modifier
            .fillMaxWidth()
            .clip(RoundedCornerShape(28.dp))
            .pointerInput(page, isAnimating) {
                if (isAnimating) return@pointerInput

                detectHorizontalDragGestures(
                    onHorizontalDrag = { _, dragAmount ->
                        val width = size.width.toFloat().coerceAtLeast(1f)
                        val resistance = when {
                            page == 0 && dragAmount > 0f -> 0.35f
                            page == pages.lastIndex && dragAmount < 0f -> 0.35f
                            else -> 1f
                        }
                        dragOffset = (dragOffset + dragAmount * resistance).coerceIn(-width, width)
                    },
                    onDragEnd = {
                        val width = size.width.toFloat().coerceAtLeast(1f)
                        val threshold = width * 0.20f
                        val currentOffset = dragOffset
                        val nextPage = when {
                            currentOffset < -threshold && page < pages.lastIndex -> page + 1
                            currentOffset > threshold && page > 0 -> page - 1
                            else -> page
                        }
                        val target = when {
                            nextPage > page -> -width
                            nextPage < page -> width
                            else -> 0f
                        }

                        isAnimating = true
                        scope.launch {
                            val animation = Animatable(currentOffset)
                            animation.animateTo(target, tween(180)) { dragOffset = value }
                            if (nextPage != page) onPageChange(nextPage)
                            dragOffset = 0f
                            isAnimating = false
                        }
                    },
                    onDragCancel = {
                        val currentOffset = dragOffset
                        isAnimating = true
                        scope.launch {
                            val animation = Animatable(currentOffset)
                            animation.animateTo(0f, tween(160)) { dragOffset = value }
                            dragOffset = 0f
                            isAnimating = false
                        }
                    }
                )
            }
    ) {
        val widthPx = constraints.maxWidth.toFloat()
        Row(
            modifier = Modifier
                .fillMaxWidth()
                .graphicsLayer { translationX = -page * widthPx + dragOffset }
        ) {
            pages.forEach { content ->
                Box(modifier = Modifier.width(this@BoxWithConstraints.maxWidth)) { content() }
            }
        }
    }
}

'''
          p.write_text(s[:start] + new_fn + s[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/eleyas/expensetracker/ui/screens/HomeScreen.kt
          git commit -m "Fix home card swipe rendering and interaction" || exit 0
          git push
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-home-swipe-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-time-home-swipe-fix.yml
          git commit -m "Remove one-time home swipe fix workflow" || exit 0
          git push
